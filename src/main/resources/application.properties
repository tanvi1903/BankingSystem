spring.application.name=banking-system
server.port=8081

# MySQL Database Connection (Tuned for High-Throughput Prepared Statements)
spring.datasource.url=jdbc:mysql://localhost:3306/banking_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=Tanvi@1903
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Tuning (20+ Concurrent Worker Threads)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000

# JPA & Schema Validation (Disable Open-In-View so post-benchmark reads hit fresh DB state)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/seed.sql

# Logging (Keep INFO/WARN business logs, suppress noisy SQL/Hibernate chatter)
logging.level.root=INFO
logging.level.org.hibernate.SQL=OFF

# Admin Security Credentials
app.security.admin.username=admin
app.security.admin.password=Admin@123
logging.level.com.banking.bankingsystem=ERROR
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

