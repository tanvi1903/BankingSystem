spring.application.name=banking-system
server.port=8080

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/banking_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=Tanvi@1903
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Tuning (Critical for 20-Thread Concurrency Load)
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA & Schema Validation (Schema managed via schema.sql + seed.sql)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/seed.sql

# Admin Security Credentials (For Admin Endpoints & Simulator)
app.security.admin.username=admin
app.security.admin.password=Admin@123
server.port=8081
